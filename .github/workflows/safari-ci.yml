name: Safari build and signing

on:
  push:
    branches: [codex/safari-ci-signing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-${{ github.ref }}
  cancel-in-progress: false

env:
  SAFARI_BUNDLE_ID: io.github.brotherhoodofscu.scuplus

jobs:
  build:
    name: Test and build unsigned Safari app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No Apple secrets are available to dependency install/build hooks.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compat
      - name: Chromium regression build
        run: pnpm build
      - name: Firefox regression build
        run: pnpm build --target=firefox-mv3
      - name: Build universal macOS app and Xcode project
        run: bash scripts/build-safari-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: safari-unsigned-${{ github.sha }}
          path: |
            build/safari-mv3-prod.zip
            build/scu-plus-safari-macos-unsigned.zip
            build/scu-plus-safari-xcode.zip
          if-no-files-found: error
          retention-days: 14
      - name: Explain signing status
        env:
          SIGNING_ENABLED: ${{ vars.APPLE_SIGNING_ENABLED }}
        run: |
          if [[ "$SIGNING_ENABLED" != true ]]; then
            echo 'Unsigned build complete. Signing and notarization were NOT run. Configure the Apple secrets in SAFARI_BUILD.md, then set APPLE_SIGNING_ENABLED=true and rerun.' >> "$GITHUB_STEP_SUMMARY"
          fi

  sign:
    name: Developer ID sign and notarize
    needs: build
    if: github.repository == 'Visio-Vanitas/scu-plus' && github.ref == 'refs/heads/codex/safari-ci-signing' && vars.APPLE_SIGNING_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: safari-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned
      - name: Install temporary signing identity
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${P12_BASE64:?Missing MACOS_DEVELOPER_ID_P12_BASE64}"
          : "${P12_PASSWORD:?Missing MACOS_DEVELOPER_ID_P12_PASSWORD}"
          : "${API_PRIVATE_KEY:?Missing APPLE_API_PRIVATE_KEY}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}"
          : "${APPLE_API_ISSUER_ID:?Missing APPLE_API_ISSUER_ID}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID variable}"
          : "${MACOS_SIGNING_IDENTITY:?Missing MACOS_SIGNING_IDENTITY variable}"
          umask 077
          SIGNING_DIR="$RUNNER_TEMP/safari-signing"
          mkdir -p "$SIGNING_DIR"
          KEYCHAIN_PATH="$SIGNING_DIR/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$P12_BASE64" | base64 --decode > "$SIGNING_DIR/identity.p12"
          printf '%s' "$API_PRIVATE_KEY" > "$SIGNING_DIR/api.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGNING_DIR/identity.p12" -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials SCUPlus \
            --key "$SIGNING_DIR/api.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --keychain "$KEYCHAIN_PATH"
      - name: Sign app and create DMG
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/unsigned/scu-plus-safari-macos-unsigned.zip" "$RUNNER_TEMP/app"
          APP_PATH="$RUNNER_TEMP/app/SCU Plus.app"
          bash scripts/sign-safari-app.sh "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/dmg-root"
          ditto "$APP_PATH" "$RUNNER_TEMP/dmg-root/SCU Plus.app"
          ln -s /Applications "$RUNNER_TEMP/dmg-root/Applications"
          hdiutil create -volname 'SCU Plus' -srcfolder "$RUNNER_TEMP/dmg-root" \
            -ov -format UDZO "$RUNNER_TEMP/scu-plus-safari-macos.dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$RUNNER_TEMP/scu-plus-safari-macos.dmg"
      - name: Notarize, staple and verify
        run: |
          set -euo pipefail
          DMG_PATH="$RUNNER_TEMP/scu-plus-safari-macos.dmg"
          xcrun notarytool submit "$DMG_PATH" --keychain-profile SCUPlus \
            --keychain "$RUNNER_TEMP/safari-signing/signing.keychain-db" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -v "$DMG_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: safari-signed-notarized-${{ github.sha }}
          path: ${{ runner.temp }}/scu-plus-safari-macos.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing materials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/safari-signing/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/safari-signing"
