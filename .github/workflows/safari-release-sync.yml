name: Sync upstream Safari releases

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published upstream vX.Y.Z tag (empty: next missing release)'
        required: false
        type: string

permissions:
  contents: read
concurrency:
  group: safari-release-sync
  cancel-in-progress: false

env:
  SAFARI_BUNDLE_ID: io.github.brotherhoodofscu.scuplus

jobs:
  resolve:
    if: github.repository == 'Visio-Vanitas/scu-plus'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.release.outputs.build }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/safari-release-sync.py resolve

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: The-Brotherhood-of-SCU/scu-plus
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Safari packaging without merging fork application code
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          cp scripts/package-safari-xcode.sh scripts/build-safari-native.sh source/scripts/
          python3 - <<'PYTHON'
          import json, os, pathlib
          p = pathlib.Path('source/package.json')
          data = json.loads(p.read_text())
          assert data['version'] == os.environ['EXPECTED_VERSION'], 'Tag/package version mismatch'
          data['scripts']['build:safari'] = 'plasmo build --target=safari-mv3 --zip'
          data['scripts']['package:safari:xcode'] = 'bash scripts/package-safari-xcode.sh'
          data['checkForUpdateLink'] = 'https://api.github.com/repos/Visio-Vanitas/scu-plus/releases/latest'
          data['download'] = 'https://github.com/Visio-Vanitas/scu-plus/releases'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PYTHON
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - name: Build Safari native app from pinned upstream source
        run: bash scripts/build-safari-native.sh
        working-directory: source
      - uses: actions/upload-artifact@v4
        with:
          name: sync-unsigned-${{ github.run_id }}
          path: |
            source/build/scu-plus-safari-macos-unsigned.zip
            source/build/safari-mv3-prod.zip
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Developer ID sign and notarize
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true' && vars.APPLE_SIGNING_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sync-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/unsigned
      - name: Install temporary signing identity
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${P12_BASE64:?Missing MACOS_DEVELOPER_ID_P12_BASE64}"
          : "${P12_PASSWORD:?Missing MACOS_DEVELOPER_ID_P12_PASSWORD}"
          : "${API_PRIVATE_KEY:?Missing APPLE_API_PRIVATE_KEY}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}"
          : "${APPLE_API_ISSUER_ID:?Missing APPLE_API_ISSUER_ID}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID variable}"
          : "${MACOS_SIGNING_IDENTITY:?Missing MACOS_SIGNING_IDENTITY variable}"
          umask 077
          SIGNING_DIR="$RUNNER_TEMP/safari-signing"
          mkdir -p "$SIGNING_DIR"
          KEYCHAIN_PATH="$SIGNING_DIR/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$P12_BASE64" | base64 --decode > "$SIGNING_DIR/identity.p12"
          printf '%s' "$API_PRIVATE_KEY" > "$SIGNING_DIR/api.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGNING_DIR/identity.p12" -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials SCUPlus \
            --key "$SIGNING_DIR/api.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --keychain "$KEYCHAIN_PATH"
      - name: Sign app and create DMG
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/unsigned/scu-plus-safari-macos-unsigned.zip" "$RUNNER_TEMP/app"
          APP_PATH="$RUNNER_TEMP/app/SCU Plus.app"
          bash scripts/sign-safari-app.sh "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/dmg-root"
          ditto "$APP_PATH" "$RUNNER_TEMP/dmg-root/SCU Plus.app"
          ln -s /Applications "$RUNNER_TEMP/dmg-root/Applications"
          hdiutil create -volname 'SCU Plus' -srcfolder "$RUNNER_TEMP/dmg-root" \
            -ov -format UDZO "$RUNNER_TEMP/scu-plus-safari-macos.dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$RUNNER_TEMP/scu-plus-safari-macos.dmg"
      - name: Notarize, staple and verify
        run: |
          set -euo pipefail
          DMG_PATH="$RUNNER_TEMP/scu-plus-safari-macos.dmg"
          xcrun notarytool submit "$DMG_PATH" --keychain-profile SCUPlus \
            --keychain "$RUNNER_TEMP/safari-signing/signing.keychain-db" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -v "$DMG_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: sync-signed-${{ github.run_id }}
          path: ${{ runner.temp }}/scu-plus-safari-macos.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing materials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/safari-signing/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/safari-signing"

  publish:
    needs: [resolve, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sync-signed-${{ github.run_id }}
          path: release
      - name: Publish verified Safari assets under the upstream tag
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_DIR: release
        run: |
          (cd release && sha256sum scu-plus-safari-macos.dmg > SHA256SUMS)
          python3 scripts/safari-release-sync.py publish
